<!doctype html><html><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>ClassPulse Options</title><link rel='stylesheet' href='options.css'></head><body><main class='container'><h1>ClassPulse Setup</h1><p class='sub'>Your Canvas command center</p><section class='card'><h2>Step 1: Canvas URL</h2><input id='baseUrl' placeholder='https://school.instructure.com'></section><section class='card'><h2>Step 2: Access Token</h2><input id='token' type='password' placeholder='Canvas access token'></section><section class='card'><h2>Step 3: Test connection</h2><button id='testBtn'>Test Connection</button><p id='testResult'></p></section><section class='card'><h2>Step 4: Save and sync</h2><button id='saveBtn'>Save & Sync</button><button id='disconnectBtn' class='secondary'>Disconnect</button><p id='status'></p></section><section class='card'><h2>Settings</h2><label><input type='checkbox' id='showInactiveCourses'> Show inactive/old courses</label><label><input type='checkbox' id='showUndatedAssignments'> Show assignments without due date</label><label><input type='checkbox' id='showOverdue24h'> Show overdue assignments for 24 hours</label><label><input type='checkbox' id='notificationsEnabled'> Enable notifications</label><label><input type='checkbox' id='in3Days'> Due in 3 days</label><label><input type='checkbox' id='tomorrow'> Due tomorrow</label><label><input type='checkbox' id='today'> Due today</label><label><input type='checkbox' id='in1Hour'> Due in 1 hour</label></section><section class='card'><p>Your Canvas token and assignment data stay inside your browser. ClassPulse does not send your data to any external server.</p></section></main><script type='module' src='options.js'></script></body></html>
