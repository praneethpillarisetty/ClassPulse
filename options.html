<!doctype html><html><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>ClassPulse Options</title><link rel='stylesheet' href='options.css'></head><body><main class='container'><h1>ClassPulse Settings</h1><section class='card'><h2>Connection</h2><p id='connStatus'>Not connected</p><label>Canvas URL<input id='baseUrl' type='url' placeholder='https://school.instructure.com'></label><div class='actions'><button id='connectBtn'>Connect Canvas</button><button id='disconnectBtn' class='secondary'>Disconnect</button></div></section><section class='card'><h2>Manual token fallback</h2><label>Access token<input id='token' type='password'></label><button id='saveManualBtn'>Save token</button></section><section class='card'><h2>Reminder preferences</h2><label><input id='dueToday' type='checkbox'> Due today</label><label><input id='dueTomorrow' type='checkbox'> Due tomorrow</label><label><input id='in3Days' type='checkbox'> Due in 3 days</label></section><section class='card'><h2>Privacy</h2><p>Your data stays in your browser. ClassPulse never scrapes Canvas cookies or session tokens.</p></section><p id='status'></p></main><script type='module' src='options.js'></script></body></html>
